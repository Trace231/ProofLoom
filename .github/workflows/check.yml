name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check source inventories
        run: ./proofloom check
      - name: Check launcher syntax
        run: bash -n proofloom
      - name: Test theorem dependency graph handling
        run: python -m unittest discover -s scripts -p 'test_*.py'
