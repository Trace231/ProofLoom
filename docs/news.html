<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060b10">
  <title>News · ProofLoom</title>
  <link rel="icon" href="blog-assets/favicon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: Manrope; src: url('blog-assets/fonts/Manrope-Regular.ttf') format('truetype'); font-display: swap; }
    * { box-sizing: border-box; }
    html { color-scheme: dark; background: #060b10; }
    body { margin: 0; color: #f4f1e9; font: 15px/1.7 Manrope, sans-serif; background: radial-gradient(ellipse at 75% 25%, #18233288, transparent 60%); min-height: 100svh; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, [tabindex]:focus-visible { outline: 2px solid #d1b583; outline-offset: 6px; }
    .shell { width: min(960px, calc(100% - 48px)); margin-inline: auto; padding: 36px 0 48px; }
    nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: clamp(48px, 10vh, 100px); }
    .brand { font-size: 18px; letter-spacing: -.6px; }
    .github { font-size: 12px; color: #a6afbc; }
    .github:hover { color: #ead4ae; }
    .board { overflow: hidden; border: 1px solid #a4b6cb26; border-radius: 14px; background: #080e16b8; box-shadow: 0 32px 100px #0005; }
    h1 { margin: 0; line-height: 0; }
    h1 img { display: block; width: 100%; height: 144px; object-fit: cover; object-position: left; }
    .feed { height: clamp(260px, 48svh, 480px); overflow-y: scroll; overscroll-behavior: contain; scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: #8b785b #0b131d; padding: 0 36px; }
    .feed::-webkit-scrollbar { width: 6px; }
    .feed::-webkit-scrollbar-track { background: #0b131d; }
    .feed::-webkit-scrollbar-thumb { background: #8b785b; border-radius: 8px; }
    .entry { display: grid; grid-template-columns: 108px minmax(0, 1fr); gap: 24px; padding: 27px 0; }
    time { color: #c5af8b; font: 11px/1.9 ui-monospace, monospace; padding-top: 3px; letter-spacing: .3px; }
    .entry p { margin: 0; overflow-wrap: anywhere; }
    .entry a:hover { color: #ead4ae; }
    @media (max-width: 600px) {
      .shell { width: calc(100% - 28px); padding-top: 24px; }
      nav { margin-bottom: 44px; padding-inline: 6px; }
      h1 img { height: 114px; }
      .feed { padding-inline: 22px; height: 56svh; }
      .entry { grid-template-columns: 1fr; gap: 8px; padding-block: 24px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <nav aria-label="Navigation">
      <a class="brand" href="./">ProofLoom</a>
      <a class="github" href="https://github.com/Trace231/ProofLoom">GitHub ↗</a>
    </nav>
    <main class="board" aria-labelledby="news-title">
      <h1 id="news-title"><img src="assets/news-board.svg" alt="News" width="1200" height="144"></h1>
      <section class="feed" id="feed" aria-label="Announcements" tabindex="0"></section>
    </main>
  </div>
  <script>
    // Entries in news.json: { "date": "YYYY-MM-DD", "title": "...", "url": "..." }.
    // Leave the array empty until an announcement is ready to publish.
    const feed = document.getElementById('feed');
    let lastContent;
    let loading = false;

    async function refresh() {
      if (loading) return;
      loading = true;
      try {
        const response = await fetch('news.json', { cache: 'no-store' });
        if (!response.ok) return;
        const entries = await response.json();
        if (!Array.isArray(entries)) return;
        const content = JSON.stringify(entries);
        if (content === lastContent) return;
        const fragment = document.createDocumentFragment();
        entries.filter(entry => entry && typeof entry.title === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(entry.date))
          .sort((a, b) => b.date.localeCompare(a.date))
          .forEach(entry => {
            const article = document.createElement('article');
            article.className = 'entry';
            const date = document.createElement('time');
            date.dateTime = entry.date;
            date.textContent = entry.date;
            const text = document.createElement('p');
            let url;
            try { url = new URL(entry.url, location.href); } catch {}
            if (typeof entry.url === 'string' && ['https:', 'http:'].includes(url?.protocol)) {
              const link = document.createElement('a');
              link.href = url.href;
              link.textContent = entry.title;
              text.append(link);
            } else {
              text.textContent = entry.title;
            }
            article.append(date, text);
            fragment.append(article);
          });
        const scrollTop = feed.scrollTop;
        const focusedLink = feed.contains(document.activeElement) && document.activeElement.href;
        feed.replaceChildren(fragment);
        if (focusedLink) Array.from(feed.querySelectorAll('a')).find(link => link.href === focusedLink)?.focus({ preventScroll: true });
        feed.scrollTop = scrollTop;
        lastContent = content;
      } catch {
        // Retain the current announcements if an update is temporarily unavailable.
      } finally {
        loading = false;
      }
    }
    refresh();
    setInterval(() => { if (!document.hidden) refresh(); }, 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  </script>
</body>
</html>
